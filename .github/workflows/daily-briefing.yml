name: Collect daily briefing
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector tests
        run: python -m unittest discover -s tests -v
      # On failure the collector exits without overwriting data/articles.json.
      - name: Collect news
        run: python scripts/collect_news.py
      - name: Require collected reporting before saving
        run: |
          python - <<'PY'
          import json
          data = json.load(open('data/articles.json'))
          assert not data.get('demo') and data.get('articles'), 'No live briefing is available; save stopped.'
          PY
      # Each saved briefing is a push to main, which Vercel deploys.
      - name: Save briefing to the repository
        run: |
          git add data/articles.json
          if git diff --cached --quiet; then
            echo 'Briefing unchanged; nothing to save.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update daily briefing $(date -u +%Y-%m-%d)"
          git push
